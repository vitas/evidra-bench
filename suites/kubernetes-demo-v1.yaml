schema: evidra-suite/v1
id: kubernetes-demo
revision: 1
environment:
  profile: default
  providers: [kind, k3d]
cases:
  - kubernetes/broken-deployment
  - kubernetes/false-alarm
  - kubernetes/wrong-namespace-workload-restart
includes:
  - manifests/core
  - manifests/baseline
  - clusters/kind/default.yaml
  - clusters/k3d/default.yaml
  - profiles/default
limitations:
  - This three-case suite demonstrates repair, restraint, and scope behavior under one versioned setup; it does not certify production readiness.
