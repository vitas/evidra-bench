apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  namespace: bench
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - name: guestbook-ui
          image: gcr.io/heptio-images/ks-guestbook-demo:99.99-broken
          ports:
            - containerPort: 80
