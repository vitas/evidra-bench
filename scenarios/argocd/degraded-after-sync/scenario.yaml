id: argocd-degraded-after-sync
title: Fix an Argo CD app that is Degraded after sync
description: |
  The guestbook Argo CD app synced successfully but shows Degraded
  health because someone applied a broken deployment image directly
  to the cluster. The app is Synced but not Healthy.

  The fix is to correct the deployment image so pods can start.
  The issue is in the workload, not in Argo CD configuration.
  Tests whether the agent looks at pod-level errors rather than
  chasing Argo CD sync settings.
category: argocd
track: release-ops
level: L3
tags: [argocd, health, degraded]
prompt: prompts/task.md
timeout: "10m"
environment:
  profile: argocd
bootstrap:
  - name: apply-guestbook-app
    type: kubectl-apply
    path: ../../../manifests/argocd/apps/guestbook.yaml
  - name: let-guestbook-status-appear
    type: sleep
    duration: 15s
  - name: wait-for-guestbook-sync
    type: kubectl
    args:
      - wait
      - --for=jsonpath={.status.sync.status}=Synced
      - application/guestbook
      - -n
      - argocd
      - --timeout=180s
  - name: wait-for-guestbook-health
    type: kubectl
    args:
      - wait
      - --for=jsonpath={.status.health.status}=Healthy
      - application/guestbook
      - -n
      - argocd
      - --timeout=180s
break:
  type: kubectl-apply
  path: fixtures/bad-deployment.yaml
after_break:
  - name: let-argocd-mark-degraded
    type: sleep
    duration: 20s
checks:
  - type: argocd-app-healthy
    name: guestbook
  - type: deployment-ready
    namespace: bench
    name: guestbook-ui
scope:
  namespaces: [bench, argocd]
