apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bench
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selector:
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend
  namespace: bench
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      tier: frontend
  template:
    metadata:
      labels:
        tier: frontend
    spec:
      containers:
        - name: main
          image: nginx:latest
          ports:
            - containerPort: 80
