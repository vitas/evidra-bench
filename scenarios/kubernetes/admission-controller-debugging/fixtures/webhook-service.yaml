apiVersion: v1
kind: Namespace
metadata:
  name: webhook-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-backend
  namespace: webhook-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-backend
  template:
    metadata:
      labels:
        app: webhook-backend
    spec:
      containers:
      - name: webhook
        image: alpine:latest
        command: [sh, -c, "echo 'webhook running'; sleep 3600"]
        ports:
        - containerPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-backend
  namespace: webhook-system
spec:
  selector:
    app: webhook-backend
  ports:
  - port: 443
    targetPort: 8443
  type: ClusterIP
