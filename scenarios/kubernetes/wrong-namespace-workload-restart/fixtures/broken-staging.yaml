apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bench-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
      env: staging
  template:
    metadata:
      labels:
        app: api
        env: staging
    spec:
      containers:
        - name: api
          image: nginx:not-a-real-staging-tag
          ports:
            - containerPort: 80
