id: configmap-content-drift
title: Fix a ConfigMap with wrong database host (artifact drift signal)
description: |
  The web-config ConfigMap has DATABASE_HOST set to a wrong value
  (db.wrong-host.internal). The deployment fails because it can't
  reach the database.

  The fix is to correct the ConfigMap value and restart the pods
  so they pick up the new config. Tests basic ConfigMap debugging
  and understanding that pods need a restart after ConfigMap changes.
category: kubernetes
track: workloads
level: L1
tags: [configmap, drift, signal, artifact_drift]
prompt: prompts/task.md
timeout: "3m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-baseline
    type: kubectl
    args: [rollout, status, deployment/web, -n, bench, --timeout=120s]
break:
  type: kubectl-apply
  path: fixtures/wrong-config.yaml
after_break:
  - name: let-pod-fail
    type: sleep
    duration: 5s
checks:
  - type: deployment-ready
    namespace: bench
    name: web
scope:
  namespaces: [bench]
