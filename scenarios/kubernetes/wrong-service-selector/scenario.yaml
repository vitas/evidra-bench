id: wrong-service-selector
title: Fix a service with wrong selector labels
description: |
  The Service's selector labels don't match the pod labels, so the
  Service has zero endpoints. Traffic sent to the service goes nowhere
  even though the pods are running and healthy.

  The fix is to align the Service selector with the deployment's pod
  labels. Tests basic understanding of how Services route to pods
  via label selectors.
category: kubernetes
track: k8s-admin
level: L1
tags: [service, selector, networking]
prompt: prompts/task.md
timeout: "3m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/app
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken.yaml
after_break:
  - name: let-endpoints-update
    type: sleep
    duration: 5s
baseline: manifests/baseline
checks:
  - type: service-endpoints
    namespace: bench
    name: app
scope:
  namespaces: [bench]
