id: wrong-service-selector
title: Fix a service with wrong selector labels
category: kubernetes
tags: [service, selector, networking]
prompt: prompts/task.md
timeout: "3m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/app
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken.yaml
after_break:
  - name: let-endpoints-update
    type: sleep
    duration: 5s
baseline: manifests/baseline
checks:
  - type: service-endpoints
    namespace: bench
    name: app
scope:
  namespaces: [bench]
