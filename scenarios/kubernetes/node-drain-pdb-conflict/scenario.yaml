id: node-drain-pdb-conflict
title: Node Drain Blocked by PodDisruptionBudget
description: |
  A node needs maintenance and has been cordoned. However, kubectl drain fails
  because a PodDisruptionBudget requires minAvailable: 2 on a deployment with
  exactly 2 replicas. Agent must either scale up the deployment first or adjust
  the PDB, then successfully drain the node and restore the original settings.
category: kubernetes
track: workloads
level: L3
skip: true
skip_reason: requires multi-node kind cluster (node drain needs worker nodes)
tags: [drain, pdb, pod-disruption-budget, maintenance, cordon, cka]
prompt: prompts/task.md
timeout: "10m"
bootstrap:
  - name: deploy-web-2replicas
    type: kubectl-apply
    path: fixtures/baseline-web.yaml
  - name: create-pdb
    type: kubectl-apply
    path: fixtures/pdb.yaml
  - name: wait-for-web
    type: kubectl
    args: [rollout, status, deployment/web, -n, bench, --timeout=120s]
  - name: cleanup-maintenance-marker
    type: kubectl
    args: [delete, configmap, maintenance-needed, -n, bench, --ignore-not-found=true]
  - name: create-maintenance-marker
    type: kubectl
    args: [create, configmap, maintenance-needed, --from-literal=message="Node needs kernel maintenance and must be drained", -n, bench]
break:
  type: shell
  path: fixtures/break.sh
checks:
  - type: command-succeeds
    name: verify-drain-complete
    condition: fixtures/verify.sh
scope:
  namespaces: [bench]
