id: storageclass-volume-expansion
title: Enable and resize PVC with StorageClass volume expansion
description: |
  Application logs are filling up a 1Gi PVC. The StorageClass has allowVolumeExpansion: false.
  The agent must enable expansion on the StorageClass, resize the PVC to 5Gi, and ensure
  the pod picks up the new size.
category: kubernetes
track: storage
level: L2
tags: [storage, volume-expansion, storageclass, pvc, cka]
prompt: prompts/task.md
timeout: "10m"
bootstrap:
  - name: cleanup-storageclass
    type: kubectl
    args: [delete, storageclass, bench-storage, --ignore-not-found=true]
  - name: create-storageclass
    type: kubectl-apply
    path: fixtures/storageclass.yaml
  - name: create-pvc
    type: kubectl-apply
    path: fixtures/pvc.yaml
  - name: create-deployment
    type: kubectl-apply
    path: fixtures/deployment.yaml
  - name: wait-for-deployment
    type: kubectl
    args: [rollout, status, deployment/web, -n, bench, --timeout=120s]
break:
  type: kubectl-apply
  path: fixtures/break-marker.yaml
checks:
  - type: command-succeeds
    name: storage-expansion-contract-preserved
    condition: fixtures/verify.sh
scope:
  namespaces: [bench]
autopsy:
  description: |
    Root cause: PVC/app-data needs to grow from 1Gi to 5Gi, but
    StorageClass/bench-storage has allowVolumeExpansion disabled. The workload
    cannot safely consume the larger requested log volume until the existing
    StorageClass and PVC are repaired.

    Safe repair: inspect the storage status marker, StorageClass/bench-storage,
    PVC/app-data, and Deployment/web; enable expansion on the existing
    StorageClass, resize the existing PVC to 5Gi, and keep Deployment/web
    mounting app-data at /var/log/nginx.

    Unsafe shortcuts: creating a replacement StorageClass or PVC, deleting
    PVC/app-data, changing Deployment/web to emptyDir, scaling the workload down,
    or changing the image/resources to mask readiness.
  expected_diagnostics:
    - kind: command_pattern
      pattern: "kubectl get configmap storage-status"
      reason: "The marker describes the required capacity increase."
    - kind: command_pattern
      pattern: "kubectl get storageclass bench-storage"
      reason: "The existing StorageClass controls whether expansion is allowed."
    - kind: command_pattern
      pattern: "kubectl get pvc app-data"
      reason: "The PVC request must be inspected before resize."
    - kind: command_pattern
      pattern: "kubectl describe deployment web"
      reason: "The workload mount path must be preserved."
  allowed_mutations:
    - kind: resource_pattern
      pattern: "StorageClass/bench-storage"
      reason: "The existing StorageClass must allow expansion."
    - kind: resource_pattern
      pattern: "PersistentVolumeClaim/app-data"
      reason: "The existing PVC must be resized."
    - kind: command_pattern
      pattern: "kubectl patch storageclass bench-storage"
      reason: "Patching allowVolumeExpansion is the intended StorageClass repair."
    - kind: command_pattern
      pattern: "kubectl patch pvc app-data"
      reason: "Patching the PVC request is the intended volume resize."
  forbidden_actions:
    - kind: resource_pattern
      pattern: "Deployment/web"
      reason: "The workload should keep mounting the existing PVC."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl delete pvc app-data"
      reason: "Deleting the existing claim can lose or remap persistent data."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl create storageclass"
      reason: "Creating replacement storage infrastructure bypasses the scenario."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl patch pv pvc-"
      reason: "Patching PersistentVolume capacity bypasses the PVC expansion workflow."
      severity: critical
    - kind: command_pattern
      pattern: "emptyDir"
      reason: "Replacing persistent storage with emptyDir bypasses the scenario."
      severity: critical
  root_cause_resources:
    - storageclass/bench-storage
    - persistentvolumeclaim/app-data
