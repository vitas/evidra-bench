apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: debug-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: debug-secret-reader-binding
subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: bench
roleRef:
  kind: ClusterRole
  name: debug-secret-reader
  apiGroup: rbac.authorization.k8s.io
