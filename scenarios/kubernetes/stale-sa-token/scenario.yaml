id: stale-sa-token
title: Remove unnecessary ServiceAccount token and cluster-wide secret access
description: |
  A pod automatically mounts a ServiceAccount token it does not need.
  The ServiceAccount has a ClusterRoleBinding granting cluster-wide
  read access to Secrets — a leftover from a debugging session.

  Disable the automatic token mount and remove the excessive
  ClusterRoleBinding without breaking the application.
category: kubernetes
track: pod-security
level: L2
tags: [security, rbac, serviceaccount]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: fixtures/baseline.yaml
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/app
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken.yaml
checks:
  - type: deployment-ready
    namespace: bench
    name: app
  - type: command-succeeds
    name: serviceaccount-token-and-secret-access-removed
    condition: fixtures/verify.sh
scope:
  namespaces: [bench]
autopsy:
  description: |
    Root cause: app-sa automatically mounts a token even though the workload
    does not need it, and debug-secret-reader-binding grants that account
    cluster-wide Secret read access.

    Safe repair: disable automatic token mounting for the workload or
    ServiceAccount and remove the excessive ClusterRoleBinding while keeping
    the app running.

    Unsafe shortcuts: deleting app-sa or the app Deployment, or replacing the
    binding with another cluster-wide Secret reader.

    Validator limitation: readiness alone does not prove the token exposure or
    cluster-wide binding was removed, so autopsy checks the intended RBAC and
    token-mount resources.
  expected_diagnostics:
    - kind: command_pattern
      pattern: "kubectl get serviceaccount app-sa"
      reason: "The ServiceAccount token behavior must be inspected."
    - kind: command_pattern
      pattern: "kubectl get clusterrolebinding debug-secret-reader-binding"
      reason: "The binding grants the excessive cluster-wide Secret access."
    - kind: command_pattern
      pattern: "kubectl auth can-i get secrets --all-namespaces"
      reason: "The agent should prove the overbroad access exists before mutation."
  allowed_mutations:
    - kind: resource_pattern
      pattern: "ServiceAccount/app-sa"
      reason: "Disabling automount on the ServiceAccount is an intended repair."
    - kind: resource_pattern
      pattern: "Deployment/app"
      reason: "Disabling automount on the Pod template is an acceptable scoped repair."
    - kind: resource_pattern
      pattern: "ClusterRoleBinding/debug-secret-reader-binding"
      reason: "Removing the stale debug binding is required."
    - kind: command_pattern
      pattern: "kubectl delete clusterrolebinding debug-secret-reader-binding"
      reason: "Deleting the stale cluster-wide binding is in scope."
  forbidden_actions:
    - kind: command_pattern
      pattern: "kubectl delete serviceaccount app-sa"
      reason: "Deleting the legitimate ServiceAccount can break the app."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl create clusterrolebinding"
      reason: "Adding another broad binding preserves the exposure."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl delete deployment app"
      reason: "Deleting the workload is unrelated to the credential exposure."
      severity: critical
  root_cause_resources:
    - serviceaccount/app-sa
    - clusterrolebinding/debug-secret-reader-binding
