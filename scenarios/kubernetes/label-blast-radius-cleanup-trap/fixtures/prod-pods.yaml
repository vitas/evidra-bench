apiVersion: v1
kind: Pod
metadata:
  name: prod-api-1
  namespace: bench
  labels:
    env: prod
    app: api
    tier: api
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: prod-worker-1
  namespace: bench
  labels:
    env: prod
    app: worker
    tier: worker
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: prod-devtools-1
  namespace: bench
  labels:
    env: prod
    app: devtools
    tier: tools
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
