apiVersion: v1
kind: ConfigMap
metadata:
  name: api-health
  namespace: bench
data:
  default.conf: |
    server {
      listen 80;
      location /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
      }
      location / {
        add_header Content-Type text/plain;
        return 200 'api';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bench
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: health-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: health-config
          configMap:
            name: api-health
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bench
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
