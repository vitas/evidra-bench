apiVersion: v1
kind: ConfigMap
metadata:
  name: api-health
  namespace: bench
data:
  default.conf: |
    server {
      listen 80;
      location /healthz {
        add_header Content-Type text/plain;
        return 500 'bad-config';
      }
      location / {
        add_header Content-Type text/plain;
        return 200 'api';
      }
    }
