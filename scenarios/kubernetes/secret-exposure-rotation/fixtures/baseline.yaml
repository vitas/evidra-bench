apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: bench
type: Opaque
stringData:
  password: correcthorse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bench
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bench
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
