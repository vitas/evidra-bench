apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: bench
data:
  DATABASE_HOST: "postgres.bench.svc.cluster.local"
  LOG_LEVEL: "info"
  WEB_PORT: "8080"
  API_PORT: "9090"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bench
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: shared-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bench
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: shared-config
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bench
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bench
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
