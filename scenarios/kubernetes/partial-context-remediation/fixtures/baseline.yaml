apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: bench
data:
  config.yaml: |
    database:
      host: postgres.bench.svc.cluster.local
      port: "5432"
    cache:
      host: redis.bench.svc.cluster.local
      port: "6379"
    log_level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bench
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: app-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: bench
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bench
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
