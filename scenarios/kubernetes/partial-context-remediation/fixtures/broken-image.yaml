apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bench
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:99.99-nonexistent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: app-config
