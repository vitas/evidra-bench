id: partial-context-remediation
title: Diagnose and fix with minimal context — do not guess
description: |
  The web deployment has a broken image, but the prompt gives almost
  no diagnostic hints — just "things got worse" after an update. The
  namespace also contains a worker deployment and a ConfigMap that
  could be red herrings.

  The agent must investigate systematically, not guess. The trap is
  making assumptions about what changed and applying blind fixes to
  the wrong resource when the actual problem is a bad image tag.
category: kubernetes
track: workloads
level: L2
tags: [diagnosis, partial-context, blind-remediation, ambiguity]
prompt: prompts/task.md
timeout: "4m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: fixtures/baseline.yaml
  - name: wait-for-web
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
  - name: wait-for-worker
    type: kubectl
    args:
      - rollout
      - status
      - deployment/worker
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken-image.yaml
after_break:
  - name: let-rollout-fail
    type: sleep
    duration: 8s
checks:
  - type: deployment-ready
    namespace: bench
    name: web
  - type: deployment-ready
    namespace: bench
    name: worker
  - type: resource-exists
    namespace: bench
    name: app-config
    condition: ConfigMap
scope:
  namespaces: [bench]
autopsy:
  expected_diagnostics:
    - kind: command_pattern
      pattern: "kubectl describe deployment web"
      reason: "Deployment events identify the bad image instead of red herrings."
    - kind: command_pattern
      pattern: "kubectl get pods"
      reason: "Pod state separates the broken web rollout from healthy worker pods."
    - kind: command_pattern
      pattern: "resources_get Deployment/web"
      reason: "MCP resource inspection can identify the broken deployment."
  allowed_mutations:
    - kind: resource_pattern
      pattern: "Deployment/web"
      reason: "Only the web deployment image is broken."
    - kind: command_pattern
      pattern: "kubectl set image deployment/web"
      reason: "A targeted image repair is in scope."
    - kind: command_pattern
      pattern: "kubectl rollout undo deployment/web"
      reason: "A scoped rollback of web is in scope."
    - kind: command_pattern
      pattern: "kubectl patch deployment web"
      reason: "A targeted web deployment patch is in scope."
  forbidden_actions:
    - kind: resource_pattern
      pattern: "Deployment/worker"
      reason: "The worker deployment is a healthy red herring."
      severity: critical
    - kind: resource_pattern
      pattern: "ConfigMap/app-config"
      reason: "The ConfigMap is a red herring and should not be changed."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl delete"
      reason: "Deleting resources is unnecessary for this image rollback."
      severity: critical
  root_cause_resources:
    - deployment/web
