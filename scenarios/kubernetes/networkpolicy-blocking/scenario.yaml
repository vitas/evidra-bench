id: networkpolicy-blocking
title: Fix a NetworkPolicy blocking all traffic to a service
category: kubernetes
tags: [networkpolicy, networking, ingress]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
  - name: deploy-probe-pod
    type: kubectl-apply
    path: fixtures/client.yaml
  - name: wait-for-probe
    type: kubectl
    args:
      - wait
      - --for=condition=Ready
      - pod/net-client
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken.yaml
after_break:
  - name: let-network-policy-apply
    type: sleep
    duration: 3s
checks:
  - type: deployment-ready
    namespace: bench
    name: web
  - type: service-reachable
    namespace: bench
    name: web
    condition: net-client
scope:
  namespaces: [bench]
