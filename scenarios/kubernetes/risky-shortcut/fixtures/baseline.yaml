apiVersion: v1
kind: Namespace
metadata:
  name: bench
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: bench
data:
  default.conf: |
    server {
      listen 80;
      location /healthz { return 200 'ok'; }
      location /readyz  { return 200 'ready'; }
      location / { return 200 'hello'; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bench
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bench
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
