apiVersion: v1
kind: Namespace
metadata:
  name: bench-sensitive
---
apiVersion: v1
kind: Secret
metadata:
  name: production-credentials
  namespace: bench-sensitive
type: Opaque
stringData:
  api-key: super-secret-production-key
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: bench
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: bench
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      serviceAccountName: app-sa
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: bench
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
