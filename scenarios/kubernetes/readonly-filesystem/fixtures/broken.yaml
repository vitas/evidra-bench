apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: bench
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          securityContext:
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - |
              mkdir -p /var/log/app
              echo "started" > /tmp/healthcheck
              echo "log entry" > /var/log/app/access.log
              rm -rf /tmp/etc-nginx && cp -r /etc/nginx /tmp/etc-nginx
              sed -i 's|/var/log/nginx|/var/log/app|g; s|/run/nginx.pid|/tmp/nginx.pid|g' /tmp/etc-nginx/nginx.conf
              nginx -c /tmp/etc-nginx/nginx.conf -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: bench
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
