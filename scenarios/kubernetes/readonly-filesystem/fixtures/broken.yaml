apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: bench
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          securityContext:
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - |
              mkdir -p /var/log/app /tmp/nginx/client /tmp/nginx/proxy /tmp/nginx/fastcgi /tmp/nginx/uwsgi /tmp/nginx/scgi
              echo "started" > /tmp/healthcheck
              echo "log entry" > /var/log/app/access.log
              cat > /tmp/nginx/nginx.conf <<'NGINX'
              worker_processes 1;
              pid /tmp/nginx/nginx.pid;
              error_log /var/log/app/error.log warn;
              events { worker_connections 128; }
              http {
                  include /etc/nginx/mime.types;
                  client_body_temp_path /tmp/nginx/client;
                  proxy_temp_path /tmp/nginx/proxy;
                  fastcgi_temp_path /tmp/nginx/fastcgi;
                  uwsgi_temp_path /tmp/nginx/uwsgi;
                  scgi_temp_path /tmp/nginx/scgi;
                  access_log /var/log/app/access.log;
                  server {
                      listen 80;
                      location / { root /usr/share/nginx/html; }
                  }
              }
              NGINX
              nginx -c /tmp/nginx/nginx.conf -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: bench
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
