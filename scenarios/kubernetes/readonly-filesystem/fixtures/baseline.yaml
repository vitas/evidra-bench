apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: bench
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          securityContext:
            readOnlyRootFilesystem: false
          command:
            - sh
            - -c
            - |
              mkdir -p /var/log/app
              echo "started" > /tmp/healthcheck
              echo "log entry" > /var/log/app/access.log
              nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: bench
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
