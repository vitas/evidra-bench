id: falco-rule-detection
title: Write a Falco rule to detect sensitive file access in a container
description: |
  A compromised container is reading /etc/shadow and writing to /etc/passwd.
  Falco is installed in the cluster but has no custom rules for these
  specific access patterns. The agent must write custom Falco rules to
  detect these accesses and verify the alerts fire.
category: kubernetes
track: runtime-security
level: L3
skip: true
skip_reason: requires environment features not yet implemented
prompt: prompts/task.md
timeout: "10m"
environment:
  kubernetes:
    addons: [falco]
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: fixtures/baseline.yaml
  - name: wait-for-baseline
    type: kubectl
    args: [rollout, status, deployment/web, -n, bench, --timeout=120s]
  - name: wait-for-falco
    type: kubectl
    args: [rollout, status, daemonset/falco, -n, falco, --timeout=180s]
break:
  type: kubectl-apply
  path: fixtures/malicious-pod.yaml
after_break:
  - name: let-pod-start
    type: sleep
    duration: 10s
checks:
  - type: deployment-ready
    namespace: bench
    name: web
  - type: command-succeeds
    name: falco-rule-exists
    condition: fixtures/verify.sh
scope:
  namespaces: [bench, falco]
