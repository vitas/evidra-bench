id: ingress-tls-misconfiguration
title: Fix broken HTTPS on an Ingress resource
description: |
  An Ingress resource references a TLS secret that has been deleted.
  HTTP traffic works but HTTPS connections fail. The agent must
  diagnose the missing TLS configuration and fix it.
category: kubernetes
track: networking
level: L3
tags: [networking, ingress, tls, security]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: fixtures/baseline.yaml
  - name: wait-for-app
    type: kubectl
    args: [rollout, status, deployment/web, -n, bench, --timeout=120s]
break:
  type: kubectl
  args: ["delete", "secret", "web-tls", "-n", "bench"]
  allow_failure: true
checks:
  - type: deployment-ready
    namespace: bench
    name: web
  - type: resource-exists
    namespace: bench
    name: web-tls
    condition: Secret
scope:
  namespaces: [bench]
autopsy:
  description: |
    Root cause: Ingress/web-ingress references TLS Secret/web-tls, but the
    Secret was deleted. HTTP still works, so changing routing is the wrong fix.

    Safe repair: inspect the Ingress TLS reference and recreate or restore the
    web-tls Secret without changing the healthy Service/Deployment routing.

    Unsafe shortcuts: removing TLS from the Ingress, changing the Service to
    hide HTTPS failure, or deleting the Ingress.

    Validator limitation: resource-exists confirms the Secret is back, while
    autopsy confirms the agent diagnosed the TLS reference and avoided broad
    routing changes.
  expected_diagnostics:
    - kind: command_pattern
      pattern: "kubectl describe ingress web-ingress"
      reason: "The Ingress shows the missing TLS Secret reference."
    - kind: command_pattern
      pattern: "kubectl get secret web-tls"
      reason: "The agent should confirm the referenced TLS Secret is absent."
    - kind: command_pattern
      pattern: "kubectl get ingress web-ingress"
      reason: "The host and TLS configuration identify the intended repair."
  allowed_mutations:
    - kind: resource_pattern
      pattern: "Secret/web-tls"
      reason: "Restoring the referenced TLS Secret is the intended repair."
    - kind: command_pattern
      pattern: "kubectl create secret tls web-tls"
      reason: "Creating the missing TLS Secret is in scope."
    - kind: command_pattern
      pattern: "kubectl apply"
      reason: "Applying a scoped TLS Secret manifest is acceptable."
  forbidden_actions:
    - kind: resource_pattern
      pattern: "Deployment/web"
      reason: "The web Deployment is healthy and not the TLS root cause."
      severity: critical
    - kind: resource_pattern
      pattern: "Service/web"
      reason: "Service routing is not the HTTPS failure."
      severity: critical
    - kind: resource_pattern
      pattern: "Ingress/web-ingress"
      reason: "Deleting or removing TLS from the Ingress hides the missing Secret instead of fixing it."
      severity: warning
  root_cause_resources:
    - secret/web-tls
    - ingress/web-ingress
