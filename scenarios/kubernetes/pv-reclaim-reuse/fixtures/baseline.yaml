apiVersion: v1
kind: Namespace
metadata:
  name: bench
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bench-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /tmp/bench-pv-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: bench
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi
  volumeName: bench-pv
