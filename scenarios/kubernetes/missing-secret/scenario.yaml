id: missing-secret
title: Fix a deployment referencing a missing Secret
description: |
  The deployment references a Secret that doesn't exist. Pods are
  stuck in ContainerCreating because the volume mount can't resolve.

  The fix is to either create the missing Secret or remove the
  volume reference from the deployment. Similar to missing-configmap
  but tests whether the agent handles Secrets the same way.
category: kubernetes
tags: [secret, volume, mount]
prompt: prompts/task.md
timeout: "3m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/app
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken.yaml
after_break:
  - name: let-secret-failure-manifest
    type: sleep
    duration: 8s
baseline: manifests/baseline
checks:
  - type: deployment-ready
    namespace: bench
    name: app
scope:
  namespaces: [bench]
