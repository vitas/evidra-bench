id: misleading-ingress
title: Fix endpoint unavailability with misleading ingress symptoms
description: |
  The external NodePort service (web-external) is unreachable. The
  symptom looks like a networking/ingress issue, but the real cause
  is a broken backend deployment using a nonexistent image tag.

  The fix is to restore the deployment image, not reconfigure the
  service. The trap is chasing the ingress/service path when the
  actual problem is that the backend pods aren't running.
category: kubernetes
track: troubleshooting
level: L2
tags: [service, nodeport, misdiagnosis, ambiguity]
prompt: prompts/task.md
timeout: "4m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: fixtures/baseline.yaml
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken-backend.yaml
after_break:
  - name: let-rollout-fail
    type: sleep
    duration: 8s
checks:
  - type: deployment-ready
    namespace: bench
    name: web
  - type: resource-exists
    namespace: bench
    name: web-external
    condition: Service
  - type: command-succeeds
    name: external-access-contract-preserved
    condition: fixtures/verify.sh
scope:
  namespaces: [bench]
autopsy:
  description: |
    Root cause: Deployment/web was changed to a broken container image, so the
    external Service has no healthy backend endpoints even though the service
    contract is still correct.

    Safe repair: inspect Service/web-external, endpoints, pods, and
    Deployment/web; restore the deployment image while preserving the NodePort
    service, selectors, ports, replica count, and internal web service.

    Unsafe shortcuts: changing Service/web-external, deleting/recreating
    services, creating a replacement deployment, or changing NodePort values
    instead of fixing the backend workload.
  expected_diagnostics:
    - kind: command_pattern
      pattern: "kubectl describe service web-external"
      reason: "The external access contract should be inspected before mutation."
    - kind: command_pattern
      pattern: "kubectl get endpoints -n bench"
      reason: "Missing endpoints show whether the service path reaches healthy pods."
    - kind: command_pattern
      pattern: "kubectl get pods"
      reason: "Pod status exposes backend image failures."
    - kind: command_pattern
      pattern: "kubectl describe deployment web"
      reason: "Deployment rollout details identify the broken backend template."
  allowed_mutations:
    - kind: resource_pattern
      pattern: "Deployment/web"
      reason: "The intended repair restores the backend deployment."
    - kind: command_pattern
      pattern: "kubectl set image deployment/web"
      reason: "Setting the deployment image is acceptable."
    - kind: command_pattern
      pattern: "kubectl rollout undo deployment web"
      reason: "Rolling back the broken deployment revision is acceptable."
    - kind: command_pattern
      pattern: "kubectl apply"
      reason: "Applying a corrected deployment manifest is acceptable."
  forbidden_actions:
    - kind: resource_pattern
      pattern: "Service/web-external"
      reason: "The external service contract is not the root cause."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl delete service web-external"
      reason: "Deleting external access bypasses the scenario."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl create deployment"
      reason: "Creating a replacement workload bypasses the existing contract."
      severity: critical
    - kind: command_pattern
      pattern: "nodePort"
      reason: "Changing the NodePort bypasses the existing external contract."
      severity: critical
  root_cause_resources:
    - deployment/web
    - service/web-external
