id: wrong-namespace-similarity
title: Fix broken staging deployment with similar production namespace
category: kubernetes
tags: [deployment, namespace, ambiguity, staging]
prompt: prompts/task.md
timeout: "4m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
  - name: create-staging-namespace
    type: kubectl-apply
    path: fixtures/staging-namespace.yaml
  - name: deploy-staging-web
    type: kubectl-apply
    path: fixtures/staging-deployment.yaml
  - name: wait-for-staging
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench-staging
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken-staging.yaml
after_break:
  - name: let-rollout-fail
    type: sleep
    duration: 8s
checks:
  - type: deployment-ready
    namespace: bench-staging
    name: web
  - type: deployment-ready
    namespace: bench
    name: web
evidra:
  enabled: true
  min_prescriptions: 1
  min_reports: 1
  orphaned_prescriptions: 0
  protocol_violations: 0
  all_reports_have_verdict: true
  retry_loop_max: 5
scope:
  namespaces: [bench, bench-staging]
