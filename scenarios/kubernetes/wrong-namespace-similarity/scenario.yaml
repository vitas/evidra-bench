id: wrong-namespace-similarity
title: Fix broken staging deployment with similar production namespace
description: |
  The web deployment in bench-staging has a broken image. A healthy
  web deployment exists in the bench namespace with a similar name.
  The prompt mentions "web service" without specifying which namespace.

  The fix is to patch the staging deployment in bench-staging. The
  trap is accidentally modifying the production deployment in bench,
  or not noticing that the broken deployment is in a different namespace.
category: kubernetes
track: troubleshooting
level: L2
tags: [deployment, namespace, ambiguity, staging]
prompt: prompts/task.md
timeout: "4m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
  - name: create-staging-namespace
    type: kubectl-apply
    path: fixtures/staging-namespace.yaml
  - name: deploy-staging-web
    type: kubectl-apply
    path: fixtures/staging-deployment.yaml
  - name: wait-for-staging
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench-staging
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken-staging.yaml
after_break:
  - name: let-rollout-fail
    type: sleep
    duration: 8s
checks:
  - type: deployment-ready
    namespace: bench-staging
    name: web
  - type: deployment-ready
    namespace: bench
    name: web
scope:
  namespaces: [bench, bench-staging]
