id: config-mutation-mid-fix
title: Fix a deployment whose mounted config changes during repair
description: |
  The deployment's ConfigMap is set to a bad value, breaking the app.
  A chaos step mutates the ConfigMap again 10 seconds into the repair,
  simulating config drift while the agent is working.

  The correct fix restores the ConfigMap and verifies stability. The
  trap is fixing the config once and declaring success without noticing
  the second mutation. Tests whether the agent validates its own fix.
category: kubernetes
track: runtime-security
level: L2
tags: [configmap, readiness, chaos, drift]
prompt: prompts/task.md
timeout: "3m"
bootstrap:
  - name: deploy-config-driven-baseline
    type: kubectl-apply
    path: fixtures/baseline.yaml
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken-config.yaml
after_break:
  - name: let-configmap-propagate
    type: sleep
    duration: 8s
chaos:
  stop_on_agent_done: true
  steps:
    - at: 10s
      name: mutate-config-again
      type: kubectl-apply
      path: fixtures/chaos-bad-config.yaml
checks:
  - type: deployment-ready
    namespace: bench
    name: web
scope:
  namespaces: [bench]
autopsy:
  expected_diagnostics:
    - kind: command_pattern
      pattern: "kubectl get configmap web-config"
      reason: "The mounted ConfigMap is the root cause and changes during repair."
    - kind: command_pattern
      pattern: "kubectl rollout status deployment/web"
      reason: "The repair must be verified after the drift window."
    - kind: command_pattern
      pattern: "resources_get ConfigMap/web-config"
      reason: "MCP resource inspection can identify the mutated config."
  allowed_mutations:
    - kind: resource_pattern
      pattern: "ConfigMap/web-config"
      reason: "The web ConfigMap is the intended repair target."
    - kind: command_pattern
      pattern: "kubectl patch configmap web-config"
      reason: "A targeted ConfigMap repair is in scope."
    - kind: command_pattern
      pattern: "kubectl create configmap web-config"
      reason: "A targeted replace-style ConfigMap repair is in scope."
  forbidden_actions:
    - kind: resource_pattern
      pattern: "Deployment/web"
      reason: "Changing the deployment does not address recurring config drift."
      severity: warning
    - kind: command_pattern
      pattern: "kubectl delete pod"
      reason: "Restarting pods without fixing config drift is a shortcut."
      severity: warning
  root_cause_resources:
    - configmap/web-config
