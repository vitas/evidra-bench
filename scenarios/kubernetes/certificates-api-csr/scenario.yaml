id: certificates-api-csr
title: CertificateSigningRequest Approval and RBAC
description: |
  A developer has submitted a CertificateSigningRequest (CSR) that is pending
  approval. Agent must review and approve the CSR, then create a Role and
  RoleBinding granting the developer read-only access (get, list, watch) to
  pods in the bench namespace.
category: kubernetes
track: pod-security
level: L2
tags: [certificates, csr, rbac, user-management, cka]
prompt: prompts/task.md
timeout: "10m"
bootstrap:
  - name: create-bench-namespace
    type: kubectl
    args: [create, namespace, bench]
  - name: deploy-web
    type: kubectl-apply
    path: fixtures/baseline-web.yaml
  - name: generate-developer-csr
    type: shell
    command: |
      # Generate a private key
      openssl genrsa -out /tmp/developer.key 2048
      # Generate a CSR
      openssl req -new -key /tmp/developer.key -out /tmp/developer.csr \
        -subj "/CN=developer/O=developers"
      # Convert CSR to base64 (no newlines)
      CSR_DATA=$(cat /tmp/developer.csr | base64 -w 0)
      # Create CSR object
      kubectl apply -f - <<EOF
      apiVersion: certificates.k8s.io/v1
      kind: CertificateSigningRequest
      metadata:
        name: developer-csr
      spec:
        request: $CSR_DATA
        signerName: kubernetes.io/kube-apiserver-client
        usages:
        - client auth
      EOF
  - name: wait-for-web
    type: kubectl
    args: [rollout, status, deployment/web, -n, bench, --timeout=120s]
  - name: create-instructions
    type: kubectl
    args: [create, configmap, csr-instructions, --from-literal=task="Approve the developer CSR and grant read-only pod access in bench namespace", -n, bench]
break:
  type: shell
  command: |
    # CSR remains pending - no action needed for the break, it's already created in bootstrap
    echo "CSR is pending approval"
checks:
  - type: command-succeeds
    name: verify-csr-and-rbac
    condition: fixtures/verify.sh
scope:
  namespaces: [bench]
