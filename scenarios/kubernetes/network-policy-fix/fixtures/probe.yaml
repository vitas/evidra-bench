apiVersion: v1
kind: Pod
metadata:
  name: net-client
  namespace: bench
  labels:
    app: net-client
spec:
  restartPolicy: Always
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-probe
  namespace: bench
  labels:
    app: frontend
    tier: frontend
    bench-probe: "true"
spec:
  restartPolicy: Always
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: backend-probe
  namespace: bench
  labels:
    app: backend
    tier: backend
    bench-probe: "true"
spec:
  restartPolicy: Always
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
