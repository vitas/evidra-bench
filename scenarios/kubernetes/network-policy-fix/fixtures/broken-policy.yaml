# Broken: uses podSelector that matches BOTH backend and database,
# so frontend can reach the database directly (should only reach backend).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-access
  namespace: bench
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [backend, database]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 80
