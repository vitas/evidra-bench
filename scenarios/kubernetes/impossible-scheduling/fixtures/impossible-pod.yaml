# All three blockers in one workload: an architecture no node has,
# requests above cluster capacity, and no toleration for the evaluator
# taint. The manifest apply SUCCEEDS (it is the API, not the scheduler);
# the pod lands Pending and every blocker materializes before the agent
# starts (after_break settles the taint).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-test
  namespace: bench
  labels:
    app: scheduler-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler-test
  template:
    metadata:
      labels:
        app: scheduler-test
    spec:
      nodeSelector:
        kubernetes.io/arch: s390x
      containers:
        - name: app
          image: nginx:1.27
          resources:
            requests:
              cpu: "16"
              memory: "64Gi"
      tolerations: []
