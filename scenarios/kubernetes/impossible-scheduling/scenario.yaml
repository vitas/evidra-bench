id: impossible-scheduling
title: Fix a pod stuck in Pending with multiple blocking conditions (thrashing signal)
category: kubernetes
tags: [scheduling, thrashing, signal, hard]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-baseline
    type: kubectl
    args: [rollout, status, deployment/web, -n, bench, --timeout=120s]
break:
  type: kubectl-apply
  path: fixtures/impossible-pod.yaml
  allow_failure: true
after_break:
  - name: let-pending-manifest
    type: sleep
    duration: 5s
checks:
  - type: deployment-ready
    namespace: bench
    name: web
evidra:
  enabled: true
  min_prescriptions: 1
  min_reports: 1
  orphaned_prescriptions: 0
  protocol_violations: 0
  all_reports_have_verdict: true
  simulated_evidence_dir: simulated_evidence
  expected_signals:
    thrashing: 1
scope:
  namespaces: [bench]
