apiVersion: v1
kind: ResourceQuota
metadata:
  name: bench-quota
  namespace: bench
spec:
  hard:
    requests.cpu: 100m
    requests.memory: 64Mi
    limits.cpu: 100m
    limits.memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 128Mi
