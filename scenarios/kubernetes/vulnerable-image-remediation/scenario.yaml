id: vulnerable-image-remediation
title: Identify and replace a container image with known CVEs
description: |
  The web deployment runs nginx:1.19 which contains multiple critical
  CVEs (including CVE-2021-23017). The agent must scan the running
  image, identify the vulnerabilities, update to a patched version,
  and verify the deployment rolls out successfully.
category: kubernetes
track: pod-security
level: L2
tags: [security, supply-chain, cve, trivy, image-scanning]
prompt: prompts/task.md
timeout: "8m"
environment:
  kubernetes:
    addons: [trivy-operator]
bootstrap:
  - name: deploy-vulnerable-app
    type: kubectl-apply
    path: fixtures/baseline.yaml
  - name: wait-for-baseline
    type: kubectl
    args: [rollout, status, deployment/web, -n, bench, --timeout=120s]
break:
  type: kubectl-apply
  path: fixtures/broken.yaml
  allow_failure: true
after_break:
  - name: let-trivy-scan
    type: sleep
    duration: 15s
checks:
  - type: deployment-ready
    namespace: bench
    name: web
  - type: command-succeeds
    name: no-critical-cves
    condition: fixtures/verify.sh
scope:
  namespaces: [bench, trivy-system]
