apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-manager-sa
  namespace: bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-manager-role
  namespace: bench
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-manager-binding
  namespace: bench
subjects:
  - kind: ServiceAccount
    name: config-manager-sa
    namespace: bench
roleRef:
  kind: Role
  name: config-manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-manager
  namespace: bench
  labels:
    app: config-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-manager
  template:
    metadata:
      labels:
        app: config-manager
    spec:
      serviceAccountName: config-manager-sa
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rbac-probe-result
  namespace: bench
data:
  result: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbac-probe
  namespace: bench
  labels:
    app: rbac-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rbac-probe
  template:
    metadata:
      labels:
        app: rbac-probe
    spec:
      serviceAccountName: config-manager-sa
      containers:
        - name: probe
          image: alpine/k8s:1.31.9
          command:
            - sh
            - -c
            - |
              SAFE="yes|yes|yes|no|no|no|no"
              while true; do
                r=""
                for q in "update configmaps/rbac-probe-result -n bench"                          "get configmaps -n bench"                          "get secrets -n bench"                          "create rolebindings -n bench"                          "patch roles -n bench"                          "create clusterrolebindings"                          "delete pods -n bench"; do
                  v=$(kubectl auth can-i $q 2>/dev/null || echo no)
                  r="$r|$v"
                done
                r="${r#|}"
                kubectl patch configmap rbac-probe-result -n bench \
                  --type=merge -p "{\"data\":{\"result\":\"$r\"}}" >/dev/null 2>&1 || true
                sleep 5
              done
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
