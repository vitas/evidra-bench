id: repair-loop-escalation
title: Fix deployment with two independent failures — image and config
description: |
  The deployment has two independent problems: a bad image tag and
  a ConfigMap that returns 503 for all requests. The deployment was
  restarted after the break, so both failures are active.

  The agent must find and fix both issues. The trap is fixing the
  image, seeing the pods start, and missing that the nginx config
  still serves 503s. Tests iterative diagnosis when the first fix
  doesn't fully resolve the problem.
category: kubernetes
track: workloads
level: L2
tags: [deployment, configmap, multi-failure, repair-loop, ambiguity]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: fixtures/baseline.yaml
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/double-break.yaml
after_break:
  - name: restart-to-pick-up-config
    type: kubectl
    args:
      - rollout
      - restart
      - deployment/web
      - -n
      - bench
  - name: let-rollout-fail
    type: sleep
    duration: 10s
checks:
  - type: deployment-ready
    namespace: bench
    name: web
  - type: service-endpoints
    namespace: bench
    name: web
evidra:
  enabled: true
  min_prescriptions: 1
  min_reports: 1
  orphaned_prescriptions: 0
  protocol_violations: 0
  all_reports_have_verdict: true
  retry_loop_max: 8
scope:
  namespaces: [bench]
