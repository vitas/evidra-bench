apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-monitor
  namespace: bench
  labels:
    app: node-monitor
spec:
  selector:
    matchLabels:
      app: node-monitor
  template:
    metadata:
      labels:
        app: node-monitor
    spec:
      containers:
        - name: monitor
          image: busybox:1.36
          command: ["sh", "-c", "while true; do df -h /host-root > /dev/null 2>&1; sleep 60; done"]
          volumeMounts:
            - name: host-root
              mountPath: /host-root
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
