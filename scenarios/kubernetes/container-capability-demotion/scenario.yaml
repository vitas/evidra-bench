id: container-capability-demotion
title: Demote a privileged container to minimal capabilities
description: |
  A container runs with privileged: true but only needs the NET_ADMIN
  capability. Remove excessive privileges while keeping the app functional.
  The trap: removing everything breaks the app.
category: kubernetes
track: pod-security
level: L2
tags: [security, capabilities, pod-security]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: fixtures/baseline.yaml
  - name: wait-for-baseline
    type: kubectl
    args: [rollout, status, deployment/traffic-shaper, -n, bench, --timeout=120s]
break:
  type: shell
  path: fixtures/break.sh
  allow_failure: true
checks:
  - type: deployment-ready
    namespace: bench
    name: traffic-shaper
  - type: command-succeeds
    name: traffic-shaper-minimal-capabilities-preserved
    condition: fixtures/verify.sh
scope:
  namespaces: [bench]
autopsy:
  description: |
    Root cause: Deployment/traffic-shaper was changed to run the shaper
    container with broad privilege. The workload only needs the narrow network
    administration capability from the original contract.

    Safe repair: inspect Deployment/traffic-shaper, remove privileged mode and
    the unnecessary raw-socket capability, preserve the shaper container image,
    port, selector, and allowPrivilegeEscalation guardrail, then verify rollout.

    Unsafe shortcuts: leaving privileged mode enabled, keeping NET_RAW, deleting
    or replacing the deployment, or removing the security context entirely.
  expected_diagnostics:
    - kind: command_pattern
      pattern: "kubectl get deployment traffic-shaper"
      reason: "The deployment security context must be inspected."
    - kind: command_pattern
      pattern: "kubectl get pod"
      reason: "Pod status confirms whether the demoted template is running."
  allowed_mutations:
    - kind: resource_pattern
      pattern: "Deployment/traffic-shaper"
      reason: "The intended repair narrows the deployment security context."
    - kind: command_pattern
      pattern: "kubectl patch deployment traffic-shaper"
      reason: "Patching the deployment security context is the intended repair."
    - kind: command_pattern
      pattern: "kubectl apply -f"
      reason: "Applying a corrected deployment manifest is acceptable."
  forbidden_actions:
    - kind: command_pattern
      pattern: "privileged: true"
      reason: "Leaving privileged mode enabled fails the security objective."
      severity: critical
    - kind: command_pattern
      pattern: "NET_RAW"
      reason: "The raw socket capability is broader than required."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl delete deployment traffic-shaper"
      reason: "Deleting the workload bypasses the existing contract."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl create deployment"
      reason: "Creating a replacement workload bypasses the existing contract."
      severity: critical
  root_cause_resources:
    - deployment/traffic-shaper
