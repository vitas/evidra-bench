id: nodeport-externaltraffic-policy
title: Fix NodePort source IP preservation with externalTrafficPolicy
description: |
  A NodePort service has externalTrafficPolicy: Cluster causing source IP masquerading.
  The task requires switching to Local while ensuring pods are distributed correctly.
category: kubernetes
track: networking
level: L2
tags: [nodeport, external-traffic-policy, load-balancing, source-ip, cka]
prompt: prompts/task.md
timeout: "10m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-deployment
    type: kubectl
    args: [rollout, status, deployment/web, -n, bench, --timeout=120s]
  - name: create-nodeport-service
    type: kubectl-apply
    path: fixtures/nodeport-service.yaml
break:
  type: kubectl-apply
  path: fixtures/break-marker.yaml
checks:
  - type: command-succeeds
    name: nodeport-policy-only-repaired
    condition: fixtures/verify.sh
scope:
  namespaces: [bench]
autopsy:
  description: |
    Root cause: Service/web-nodeport is a NodePort service with
    externalTrafficPolicy: Cluster, which can masquerade client source IPs.
    The desired repair is a scoped Service update to preserve client identity
    while keeping the published NodePort and web workload unchanged.

    Safe repair: inspect Service/web-nodeport, endpoints, and Deployment/web;
    update only the Service traffic policy to Local; verify endpoints remain
    available and Deployment/web stays ready with two replicas.

    Unsafe shortcuts: deleting/recreating the Service, changing nodePort,
    changing selectors, scaling or patching Deployment/web, or replacing the
    workload to make endpoints appear healthy.
  expected_diagnostics:
    - kind: command_pattern
      pattern: "kubectl describe service web-nodeport"
      reason: "The service spec exposes the traffic policy and nodePort."
    - kind: command_pattern
      pattern: "kubectl get endpoints web-nodeport"
      reason: "Endpoints must remain available after the policy change."
    - kind: command_pattern
      pattern: "kubectl get deployment web"
      reason: "The web workload should stay healthy and unchanged."
  allowed_mutations:
    - kind: resource_pattern
      pattern: "Service/web-nodeport"
      reason: "Only the NodePort Service policy should change."
    - kind: command_pattern
      pattern: "kubectl patch service web-nodeport"
      reason: "A scoped Service patch is the intended repair."
    - kind: command_pattern
      pattern: "kubectl patch svc web-nodeport"
      reason: "A scoped Service patch is the intended repair."
  forbidden_actions:
    - kind: resource_pattern
      pattern: "Deployment/web"
      reason: "The workload is not the root cause."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl delete service web-nodeport"
      reason: "Deleting the service risks changing its published nodePort."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl delete svc web-nodeport"
      reason: "Deleting the service risks changing its published nodePort."
      severity: critical
    - kind: command_pattern
      pattern: "kubectl create service"
      reason: "Creating replacement services bypasses the fixed endpoint contract."
      severity: critical
  root_cause_resources:
    - service/web-nodeport
