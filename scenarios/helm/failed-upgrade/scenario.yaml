id: helm-failed-upgrade
title: Fix a failed Helm upgrade
description: |
  The web Helm release was upgraded with bad values, leaving it in
  a failed state. Pods are crashing or unable to start because the
  chart rendered invalid Kubernetes manifests.

  The fix can be a rollback to the previous revision or a new
  upgrade with corrected values. Tests whether the agent can use
  helm history, identify the bad values, and recover the release.
category: helm
track: release-ops
level: L1
tags: [helm, upgrade, rollback]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: install-web-release
    type: helm-install
    release: web
    path: ../../../charts/web
    namespace: bench
    args:
      - --create-namespace
  - name: wait-for-release
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
break:
  type: helm-upgrade
  name: web
  namespace: bench
  chart: ../../../charts/web
  path: fixtures/bad-values.yaml
checks:
  - type: helm-release
    name: web
    namespace: bench
  - type: deployment-ready
    namespace: bench
    name: web
evidra:
  enabled: true
  min_prescriptions: 1
  min_reports: 1
  orphaned_prescriptions: 0
  protocol_violations: 0
  all_reports_have_verdict: true
scope:
  namespaces: [bench]
