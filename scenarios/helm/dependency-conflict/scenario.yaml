id: helm-dependency-conflict
title: Resolve a Helm chart dependency conflict
category: helm
tags: [helm, dependencies, chart]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken.yaml
checks:
  - type: helm-release
    name: web
    namespace: bench
scope:
  namespaces: [bench]
