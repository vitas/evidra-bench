id: helm-dependency-conflict
title: Resolve a Helm chart dependency conflict
description: |
  The web Helm release was upgraded with values that enable a
  dependency on a ConfigMap which the chart no longer renders.
  The upgrade succeeded but the workload is broken at runtime.

  The fix is to resolve the missing dependency — either by providing
  the ConfigMap or by upgrading with corrected values. Tests Helm
  troubleshooting beyond simple rollback scenarios.
category: helm
track: release-ops
level: L2
tags: [helm, dependencies, chart]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: install-web-release
    type: helm-install
    release: web
    path: ../../../charts/web
    namespace: bench
    args:
      - --create-namespace
  - name: wait-for-release
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
break:
  type: helm-upgrade
  name: web
  namespace: bench
  chart: ../../../charts/web
  path: fixtures/dependency-values.yaml
checks:
  - type: helm-release
    name: web
    namespace: bench
  - type: deployment-ready
    namespace: bench
    name: web
scope:
  namespaces: [bench]
