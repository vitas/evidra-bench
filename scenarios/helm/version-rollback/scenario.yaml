id: helm-version-rollback
title: Rollback a Helm release to a previous working version
category: helm
tags: [helm, rollback, version]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: deploy-baseline
    type: kubectl-apply
    path: ../../../manifests/baseline
  - name: wait-for-baseline
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
break:
  type: kubectl-apply
  path: fixtures/broken.yaml
checks:
  - type: helm-release
    name: web
    namespace: bench
  - type: deployment-ready
    namespace: bench
    name: web
scope:
  namespaces: [bench]
