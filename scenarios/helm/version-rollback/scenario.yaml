id: helm-version-rollback
title: Rollback a Helm release to a previous working version
description: |
  The web Helm release was upgraded with bad values and is now
  failing. A previous healthy revision exists in the release history.

  The fix is to use helm rollback to restore the previous revision.
  The agent must not uninstall and reinstall — it should use Helm's
  built-in rollback mechanism to preserve release history.
category: helm
tags: [helm, rollback, version]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: install-web-release
    type: helm-install
    release: web
    path: ../../../charts/web
    namespace: bench
    args:
      - --create-namespace
  - name: wait-for-release
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
break:
  type: helm-upgrade
  name: web
  namespace: bench
  chart: ../../../charts/web
  path: ../failed-upgrade/fixtures/bad-values.yaml
  allow_failure: true
  args:
    - --wait
    - --timeout
    - 5s
checks:
  - type: helm-release
    name: web
    namespace: bench
  - type: deployment-ready
    namespace: bench
    name: web
scope:
  namespaces: [bench]
