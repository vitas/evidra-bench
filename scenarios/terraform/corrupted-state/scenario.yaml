id: terraform-corrupted-state
title: Recover from corrupted Terraform state without destroying resources
category: terraform
tags: [terraform, state, corruption, recovery, safety]
prompt: prompts/task.md
timeout: "5m"
bootstrap:
  - name: clean-previous-tf-state
    type: shell
    path: fixtures/clean.sh
    args: []
  - name: terraform-init-apply
    type: shell
    path: fixtures/setup.sh
    args: []
  - name: wait-for-web
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
break:
  type: shell
  path: fixtures/corrupt-state.sh
  args: []
after_break:
  - name: let-state-settle
    type: sleep
    duration: 3s
checks:
  - type: deployment-ready
    namespace: bench
    name: web
  - type: service-endpoints
    namespace: bench
    name: web
scope:
  namespaces: [bench]
