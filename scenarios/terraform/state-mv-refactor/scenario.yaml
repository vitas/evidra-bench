id: terraform-state-mv-refactor
title: Refactor monolithic Terraform into modules without destroying resources
description: |
  A monolithic main.tf was refactored into two modules (app, db) but the
  Terraform state still uses the old resource addresses. terraform plan
  shows destroy-and-recreate for all 4 resources. The agent must use
  terraform state mv to move each resource to its new module-prefixed
  address so terraform plan shows no changes.
category: terraform
track: platform-eng
level: L3
tags: [terraform, state, refactor, modules, state-mv]
prompt: prompts/task.md
timeout: "8m"
bootstrap:
  - name: clean-previous-tf-state
    type: shell
    path: fixtures/clean.sh
    args: []
  - name: apply-monolithic-then-refactor
    type: shell
    path: fixtures/setup.sh
    args: []
  - name: wait-for-web
    type: kubectl
    args:
      - rollout
      - status
      - deployment/web
      - -n
      - bench
      - --timeout=120s
break:
  type: shell
  path: fixtures/break.sh
  args: []
checks:
  - type: command-succeeds
    name: verify-state-moved
    condition: fixtures/verify.sh
  - type: deployment-ready
    namespace: bench
    name: web
  - type: deployment-ready
    namespace: bench
    name: db
scope:
  namespaces: [bench]
