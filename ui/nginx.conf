server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /bench {
        try_files /index.html =404;
    }

    location = /bench/ {
        try_files /index.html =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
