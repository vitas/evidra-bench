server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /bench {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /index.html =404;
    }

    location = /bench/ {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /index.html =404;
    }

    location = /bench/runs {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /index.html =404;
    }

    location ~ ^/bench/(leaderboard|dashboard|skill-impact|regressions|insights|reviews|session|runs|scenarios|compare|mcp-readiness|benchmarks|sample-report)(/|$) {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /index.html =404;
    }

    location = /results {
        return 301 https://bench.evidra.cc/bench/runs;
    }

    location = /results/ {
        return 301 https://bench.evidra.cc/bench/runs;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    location = /sitemap.xml/ {
        return 301 https://bench.evidra.cc/sitemap.xml;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /robots.txt/ {
        return 301 https://bench.evidra.cc/robots.txt;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
