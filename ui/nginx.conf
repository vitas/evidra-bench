server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # exams.evidra.cc → redirect root to /results
    if ($host ~* ^exams\.) {
        rewrite ^/$ /results permanent;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
