{{- if gt (int .Values.hooks.preUpgradeSleepSeconds) 0 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "web.name" . }}-pre-upgrade
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sleep
          image: alpine:3.20
          command: ["sh", "-c", "sleep {{ .Values.hooks.preUpgradeSleepSeconds }}"]
  backoffLimit: 0
{{- end }}
