name: Bug Report
description: Report a reproducible Bench bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, private transcripts, customer data, or hosted report artifacts.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.0.0 or git commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Commands, scenario id, and environment details.
      placeholder: |
        1. bench-cli run --scenario ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or artifacts
      render: shell
