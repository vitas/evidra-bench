name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: bench
          fetch-depth: 0

      - name: Check DCO sign-off
        working-directory: bench
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash tests/test_dco_signoff.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: bench/go.mod
          cache: true
          cache-dependency-path: bench/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bench/ui/package-lock.json

      - name: Check formatting
        working-directory: bench
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: bench
          args: --timeout=5m

      - name: Run vulnerability scan
        working-directory: bench
        run: make vuln

      - name: Guard no core evidra dependency
        working-directory: bench
        run: bash tests/test_no_core_evidra_dependency.sh

      - name: Guard workflow hygiene
        working-directory: bench
        run: bash tests/test_workflow_hygiene.sh

      - name: Guard artifact hygiene
        working-directory: bench
        run: bash tests/test_artifact_hygiene.sh

      - name: Guard documentation consistency
        working-directory: bench
        run: bash tests/test_doc_consistency.sh

      - name: Guard repository secret hygiene
        working-directory: bench
        run: bash tests/test_secret_hygiene.sh

      - name: Guard UI secret hygiene
        working-directory: bench
        run: bash tests/test_ui_secret_hygiene.sh

      - name: Guard SEO assets
        working-directory: bench
        run: bash tests/test_seo_assets.sh

      - name: Test public API smoke script
        working-directory: bench
        run: bash tests/smoke/test_public_api_smoke.sh

      - name: Test private review smoke script
        working-directory: bench
        run: bash tests/smoke/test_private_review_smoke.sh

      - name: Install UI deps
        working-directory: bench/ui
        run: npm ci

      - name: Run UI lib tests
        working-directory: bench/ui
        run: node --test src/lib/*.test.mts

      - name: Build UI
        working-directory: bench/ui
        run: npm run build

      - name: Validate workflow files
        working-directory: bench
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

      - name: Run tests
        working-directory: bench
        run: go test ./... -count=1

      - name: Race detector
        working-directory: bench
        run: go test -race ./... -count=1

  docker-one-command-smoke:
    name: Docker one-command smoke (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [kind, k3d]
    env:
      EVIDRA_SMOKE_IMAGE: evidra-bench:one-command-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: bench

      - name: Build runner image
        run: |
          docker build -f bench/Dockerfile.bench -t evidra-bench:one-command-ci bench

      - name: Smoke (${{ matrix.provider }})
        working-directory: bench
        run: bash tests/smoke/run_docker_one_command_smoke.sh ${{ matrix.provider }}


  case-contract-smoke-kind:
    name: Case-contract smoke (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVIDRA_CONTRACT_IMAGE: evidra-bench:contract-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: bench

      - name: Build runner image
        run: docker build -f bench/Dockerfile.bench -t evidra-bench:contract-ci bench

      - name: Smoke (kind)
        working-directory: bench
        run: bash tests/contract/run_case_contract_smoke.sh kind

  case-contract-smoke-k3d:
    name: Case-contract smoke (k3d)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      EVIDRA_CONTRACT_IMAGE: evidra-bench:contract-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: bench

      - name: Build runner image
        run: docker build -f bench/Dockerfile.bench -t evidra-bench:contract-ci bench

      - name: Smoke (k3d)
        working-directory: bench
        run: bash tests/contract/run_case_contract_smoke.sh k3d


  docker-local-model-smoke:
    name: Docker local-model smoke (fake Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDRA_DOCKER_SMOKE_IMAGE: evidra-bench:local-model-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: bench

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: bench/go.mod
          cache: true
          cache-dependency-path: bench/go.sum

      - name: Build runner image
        run: |
          docker build -f bench/Dockerfile.bench -t evidra-bench:local-model-ci bench

      - name: Smoke kind with fake Ollama
        working-directory: bench
        run: bash tests/smoke/run_docker_local_model_smoke.sh kind

      - name: Smoke k3d with fake Ollama
        working-directory: bench
        run: bash tests/smoke/run_docker_local_model_smoke.sh k3d
