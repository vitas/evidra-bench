name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: evidra-stand

      - name: Checkout parent (evidra-benchmark)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/evidra
          path: evidra-benchmark
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: evidra-stand/go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evidra-stand/ui/package-lock.json

      - name: Check formatting
        working-directory: evidra-stand
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Run lint
        working-directory: evidra-stand
        run: make lint

      - name: Install UI deps
        working-directory: evidra-stand/ui
        run: npm ci

      - name: Run UI command tests
        working-directory: evidra-stand/ui
        run: node --test src/lib/runOptions.test.mts src/lib/commandBuilder.test.mts

      - name: Build UI
        working-directory: evidra-stand/ui
        run: npm run build

      - name: Run tests
        working-directory: evidra-stand
        run: go test ./... -count=1

      - name: Race detector
        working-directory: evidra-stand
        run: go test -race ./... -count=1
