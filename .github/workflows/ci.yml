name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: bench

      - name: Checkout parent (evidra-benchmark)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/evidra
          path: evidra-benchmark
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: bench/go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bench/ui/package-lock.json

      - name: Check formatting
        working-directory: bench
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: bench
          args: --timeout=5m

      - name: Install UI deps
        working-directory: bench/ui
        run: npm ci

      - name: Run UI command tests
        working-directory: bench/ui
        run: node --test src/lib/runOptions.test.mts src/lib/commandBuilder.test.mts

      - name: Build UI
        working-directory: bench/ui
        run: npm run build

      - name: Run tests
        working-directory: bench
        run: go test ./... -count=1

      - name: Race detector
        working-directory: bench
        run: go test -race ./... -count=1
