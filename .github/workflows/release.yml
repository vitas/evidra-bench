name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: evidra-stand

      - name: Checkout parent (evidra-benchmark)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/evidra
          path: evidra-benchmark
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: evidra-stand/go.mod
          cache: true

      - name: Check formatting
        working-directory: evidra-stand
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Run tests
        working-directory: evidra-stand
        run: go test ./... -count=1

      - name: Race detector
        working-directory: evidra-stand
        run: go test -race ./... -count=1

  release:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: evidra-stand

      - name: Checkout parent (evidra-benchmark)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/evidra
          path: evidra-benchmark
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: evidra-stand/go.mod
          cache: true

      - name: Build CLI binary
        working-directory: evidra-stand
        run: |
          VERSION=${{ github.ref_name }}
          COMMIT=${{ github.sha }}
          go build -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT}" -o infra-bench ./cmd/infra-bench/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: evidra-stand/infra-bench
          generate_release_notes: true

  docker:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/infra-bench
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.bench
          load: true
          tags: infra-bench:smoke
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Smoke test
        run: |
          docker run --rm infra-bench:smoke --version \
            || { echo "FAIL: smoke test failed"; exit 1; }
          echo "PASS: infra-bench smoke test ok"

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.bench
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
