name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Run tests
        run: go test ./... -count=1

      - name: Race detector
        run: go test -race ./... -count=1

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bench-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Import run data into DB
        run: |
          go build -o bin/infra-bench ./cmd/infra-bench
          bin/infra-bench db import --runs-dir runs

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: bench-api:smoke

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 18080:8080 bench-api:smoke
          sleep 2
          curl -sf http://localhost:18080/healthz
          curl -sf http://localhost:18080/v1/bench/scenarios | head -c 100
          RUNS=$(curl -sf http://localhost:18080/v1/bench/runs | python3 -c "import sys,json; print(json.load(sys.stdin)['total'])")
          echo "Runs in DB: $RUNS"
          if [ "$RUNS" -lt 1 ]; then
            echo "FAIL: no runs in database"
            docker logs smoke
            exit 1
          fi
          docker stop smoke
          docker rm smoke
          echo "PASS: smoke test ok"

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
